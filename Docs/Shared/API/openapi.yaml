      summary: Authenticate using LRN and PIN
      operationId: studentLogin
      tags:
      - Authentication
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422': *id001
        '429': *id002
        '500': *id003
        '503': *id004
        '401': &id007
          $ref: '#/components/responses/Unauthorized'
        '403': &id008
          $ref: '#/components/responses/Forbidden'
      parameters:
      - $ref: '#/components/parameters/ClientVersionHeader'
      - $ref: '#/components/parameters/DeviceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security: []
  /student/auth/logout:
