components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
  parameters:
    ClientVersionHeader:
      name: X-Client-Version
      in: header
      required: true
      schema:
        type: string
    DeviceIdHeader:
      name: X-Device-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    OptionalDeviceIdHeader:
      name: X-Device-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
    ManifestVersionHeader:
