openapi: 3.1.0
info:
  title: NutriMind Student API — Rebuild Contract
  version: 1.0.0-rebuild
  description: Canonical Student API for the fresh NutriMind rebuild. Missions use
    one Unity open-world scene with exactly three logical progression areas. The former
    separate final-challenge routes are removed; the integrated mission challenge
    is completed inside Area 3.
servers:
- url: https://{host}/api/v1
  variables:
    host:
      default: api.example.test
paths:
  /student/ping:
    get:
      summary: Check API availability
      operationId: studentPing
      tags:
      - System
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
        '422': &id001
          $ref: '#/components/responses/ValidationFailed'
        '429': &id002
          $ref: '#/components/responses/RateLimited'
        '500': &id003
          $ref: '#/components/responses/InternalError'
        '503': &id004
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - &id005
        $ref: '#/components/parameters/ClientVersionHeader'
      - &id006
        $ref: '#/components/parameters/OptionalDeviceIdHeader'
      security: []
  /student/config:
    get:
      summary: Get compatibility and operational limits
      operationId: studentConfig
      tags:
      - System
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '422': *id001
        '429': *id002
        '500': *id003
        '503': *id004
      parameters:
      - *id005
      - *id006
      - $ref: '#/components/parameters/OptionalManifestVersionHeader'
      security: []
  /student/auth/login:
