        '409': &id010
          $ref: '#/components/responses/Conflict'
        '422': *id001
        '429': *id002
        '500': *id003
        '503': *id004
      parameters: &id013
      - &id011
        $ref: '#/components/parameters/ClientVersionHeader'
      - &id012
        $ref: '#/components/parameters/DeviceIdHeader'
      security:
      - bearerAuth: []
